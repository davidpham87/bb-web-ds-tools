<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://webr.r-wasm.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://cdn.jsdelivr.net https://webr.r-wasm.org https://repo.r-wasm.org https://pypi.org https://files.pythonhosted.org; img-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self';">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet" type="text/css">
    <link href="css/xterm.css" rel="stylesheet" type="text/css">
    <link href="js/libs/vs/editor/editor.main.css" rel="stylesheet" type="text/css">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega@5.33.1" integrity="sha384-NMXhl2TbCXxcN7o4ROC56Funm78m4AylL8gMg/7Kn4YU+wrm23K9l7cY8lDRXQ9d" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.23.0" integrity="sha384-D9LYH0esGjcxQJsBuxOuXtCDJGXRWW1+KhluzWPqi0rLJmiR/ygPChefaD+rFFDQ" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.29.0" integrity="sha384-M+Ax7e/WFJpxSOF09HzI+Sj4wg9ottVd/uxmV2ItGGh02fLH28t2FAOJx3TJBap5" crossorigin="anonymous"></script>
    <script>
      self.MonacoEnvironment = {
        getWorker: function (moduleId, label) {
          const basePath = './js/libs/monaco-esm/vs';
          let url = basePath + '/editor/editor.worker.js';
          if (label === 'json') {
            url = basePath + '/language/json/json.worker.js';
          }
          if (label === 'css' || label === 'scss' || label === 'less') {
            url = basePath + '/language/css/css.worker.js';
          }
          if (label === 'html' || label === 'handlebars' || label === 'razor') {
            url = basePath + '/language/html/html.worker.js';
          }
          if (label === 'typescript' || label === 'javascript') {
            url = basePath + '/language/typescript/ts.worker.js';
          }
          return new Worker(url, { type: 'module', name: label });
        }
      };
    </script>
    <script type="module">
      import { WebR } from 'https://webr.r-wasm.org/v0.5.7/webr.mjs';
      window.WebR = WebR;
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script src="js/libs.js" type="text/javascript"></script>
    <script src="js/compiled/shared.js" type="text/javascript"></script>
    <script src="js/compiled/main.js" type="text/javascript"></script>
  </body>
</html>
